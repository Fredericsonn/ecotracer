version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  network_mode: host
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://eco:energy2025@localhost:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: 'energy2025secretkey'
    AIRFLOW__WEBSERVER__WEB_SERVER_PORT: '8081'
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
    - /home/eco/spark-cluster:/home/eco/spark-cluster
  group_add:
    - "999"  
  user: "50000:0"

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --password admin123
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@energy.local
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: airflow webserver --port 8081
    depends_on:
      - airflow-init
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: airflow scheduler
    depends_on:
      - airflow-init
    restart: always

volumes:
  airflow_logs: