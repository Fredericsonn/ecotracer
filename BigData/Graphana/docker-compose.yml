version: '3.8'
services:
  grafana:
    image: grafana/grafana:latest
    container_name: energy_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    network_mode: host

volumes:
  grafana_data: